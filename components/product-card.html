<!-- Reusable Product Showcase Card -->
<div class="product-showcase-card" data-product="{{ data_product }}">
  <div class="psc-image" style="background-image: url('{{ image }}')"></div>
  <div class="psc-overlay">
    <div class="psc-meta">
      <span class="psc-industry">{{ industry }}</span>
      <span class="psc-material">{{ material }}</span>
    </div>
    <h3 class="psc-title">{{ title }}</h3>
    <p class="psc-application">{{ description }}</p>
    <a href="/rfq.html" class="btn btn-primary">Request RFQ &rarr;</a>
  </div>
</div>
