<!-- Reusable RFQ Banner -->
<section class="section-bg-dark" style="text-align: center; padding: 5rem 2rem;">
  <div class="section-container" style="max-width: 800px; margin: 0 auto;">
    <span class="section-tagline" style="color: var(--color-accent);">{{ tagline }}</span>
    <h2 class="section-title" style="color: #fff; margin: 0 auto 1.5rem; display: inline-block; padding-bottom: 0.5rem; border-bottom: 2px solid var(--color-accent);">{{ title }}</h2>
    <p style="color: #cbd5e1; font-size: 1.15rem; margin-bottom: 2.5rem; line-height: 1.6;">{{ description }}</p>
    <a href="/rfq.html" class="btn btn-primary" style="padding: 1rem 2.5rem;">Request Sourcing Quotation &rarr;</a>
  </div>
</section>
